[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "fantasy-backend"
version = "0.1.0"
description = "Fantasy Sleeper ingestion backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.0",
  "duckdb-engine==0.17.0",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "pydantic>=2.0",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=8.2",
  "polars>=1.0",
  "numpy<2; python_version < '3.13'",
  "numpy>=2.1; python_version >= '3.13'",
  "uvicorn>=0.30",
  "nfl-data-py==0.3.3; python_version < '3.13'",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "nflreadpy>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "freezegun>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
